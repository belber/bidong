<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>壁咚收藏 后台管理</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
  :root { --bg:#f5f7fb; --panel:#fff; --line:#e5e9f0; --text:#1f2733; --muted:#7a869a;
          --main:#2563eb; --danger:#dc2626; --ok:#16a34a; --warn:#d97706; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--text); background:var(--bg); }
  .hidden { display:none !important; }
  #login { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); }
  .login-card { width:320px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:28px; box-shadow:0 8px 30px rgba(0,0,0,.08); }
  .login-card h2 { margin:0 0 4px; font-size:20px; }
  .login-card p { color:var(--muted); margin:0 0 18px; font-size:13px; }
  input, select, textarea { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; width:100%; background:#fff; }
  button { font:inherit; padding:8px 14px; border:1px solid transparent; border-radius:8px; cursor:pointer; background:var(--main); color:#fff; }
  button.ghost { background:#fff; color:var(--main); border-color:var(--main); }
  button.danger { background:var(--danger); }
  button.small { padding:4px 10px; font-size:13px; }
  #app { display:flex; min-height:100vh; }
  aside { width:200px; background:#111827; color:#cbd5e1; padding:16px 0; flex:0 0 200px; }
  aside .brand { padding:0 18px 16px; color:#fff; font-weight:600; font-size:16px; }
  aside nav a { display:block; padding:10px 18px; color:#cbd5e1; text-decoration:none; }
  aside nav a.active { background:#2563eb; color:#fff; }
  aside nav .group { padding:12px 18px 4px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:#64748b; }
  main { flex:1; padding:20px 24px; overflow:auto; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .card .label { color:var(--muted); font-size:12px; }
  .card .value { font-size:26px; font-weight:700; margin-top:2px; }
  .card .sub { color:var(--muted); font-size:12px; margin-top:2px; }
  .card .sub.ok { color:var(--ok); } .card .sub.bad { color:var(--danger); }
  .metric-row { display:flex; gap:30px; flex-wrap:wrap; align-items:baseline; }
  .metric-row .metric b { font-size:22px; font-weight:700; }
  .metric-row .metric span { color:var(--muted); font-size:12px; margin-left:6px; }
  .metric-row .blue { color:var(--main); } .metric-row .ok { color:var(--ok); }
  .metric-row .bad { color:var(--danger); } .metric-row .warn { color:var(--warn); }
  .panel .note { color:var(--muted); font-size:12px; margin:0 0 10px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .panel h3 { margin:0 0 12px; font-size:15px; }
  .chart { width:100%; height:280px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; }
  .toolbar { display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .toolbar input, .toolbar select { width:auto; min-width:120px; }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; }
  .tag.ok { background:#dcfce7; color:#166534; } .tag.bad { background:#fee2e2; color:#991b1b; } .tag.muted { background:#f1f5f9; color:#475569; }
  .alert { background:#fef2f2; border:1px solid #fecaca; color:#991b1b; padding:10px 14px; border-radius:8px; margin-bottom:16px; }
  .alert.ok { background:#f0fdf4; border-color:#bbf7d0; color:#166534; }
  .muted { color:var(--muted); }
  .host { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; word-break:break-all; }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; }
  .field-group { border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:14px; }
  .group-label { font-size:12px; font-weight:600; color:#475569; margin-bottom:10px; letter-spacing:.02em; }
  .flex { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .switch { display:inline-flex; align-items:center; gap:8px; padding:8px 0; cursor:pointer; }
  .switch input { width:auto; }
  .pill { background:#f1f5f9; color:#475569; padding:6px 14px; border-radius:8px; border:1px solid var(--line); cursor:pointer; }
  .pill.active { background:var(--main); color:#fff; border-color:var(--main); }
  .pager { display:flex; gap:8px; align-items:center; margin-top:12px; }
  #modal { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:999; }
  #modal .modal-mask { position:absolute; inset:0; background:rgba(15,23,42,.4); }
  #modal .modal-box { position:relative; width:min(720px, calc(100vw - 40px)); max-height:80vh; overflow:auto; background:#fff; border:1px solid var(--line); border-radius:12px; padding:20px; box-shadow:0 12px 40px rgba(0,0,0,.18); }
  #modal .modal-box h4 { margin:0 0 10px; font-size:16px; }
  #modal .modal-box p { margin:0 0 16px; color:var(--muted); word-break:break-word; white-space:pre-line; }
</style>
</head>
<body>
<div id="login">
  <div class="login-card">
    <h2>壁咚收藏 后台</h2>
    <p>请输入后台管理密码</p>
    <input id="pass" type="password" placeholder="密码" autocomplete="current-password" />
    <p id="login-err" class="muted"></p>
    <button style="width:100%" onclick="doLogin()">登录</button>
  </div>
</div>

<div id="app" class="hidden">
  <aside>
    <div class="brand">壁咚收藏 后台</div>
    <nav>
      <div class="group">数据监控</div>
      <a data-view="overview" class="active" href="javascript:void(0)">概览</a>
      <a data-view="visit" href="javascript:void(0)">访问监控</a>
      <a data-view="follow" href="javascript:void(0)">关注监控</a>
      <a data-view="parse" href="javascript:void(0)">解析监控</a>
      <a data-view="download" href="javascript:void(0)">下载监控</a>
      <a data-view="sources" href="javascript:void(0)">视频出处</a>
      <div class="group">运维配置</div>
      <a data-view="cookie" href="javascript:void(0)">账号/Cookie</a>
      <a data-view="features" href="javascript:void(0)">功能开关</a>
      <a data-view="schedule" href="javascript:void(0)">定时任务</a>
      <a data-view="operations" href="javascript:void(0)">运营管理</a>
      <a data-view="help" href="javascript:void(0)">帮助/反馈</a>
      <a data-view="cdn" href="javascript:void(0)">B站域名管理</a>
      <div class="group"></div>
      <a href="javascript:void(0)" onclick="logout()">退出登录</a>
    </nav>
  </aside>
  <main id="main">
    <section id="view-overview" class="view"></section>
    <section id="view-visit" class="view hidden"></section>
    <section id="view-follow" class="view hidden"></section>
    <section id="view-parse" class="view hidden"></section>
    <section id="view-download" class="view hidden"></section>
    <section id="view-cookie" class="view hidden"></section>
    <section id="view-features" class="view hidden"></section>
    <section id="view-schedule" class="view hidden"></section>
    <section id="view-operations" class="view hidden"></section>
    <section id="view-help" class="view hidden"></section>
    <section id="view-cdn" class="view hidden"></section>
    <section id="view-sources" class="view hidden"></section>
  </main>
</div>

<div id="modal" class="hidden">
  <div class="modal-mask" onclick="hideModal()"></div>
  <div class="modal-box">
    <h4 id="modal-title">提示</h4>
    <p id="modal-body"></p>
    <button onclick="hideModal()">确定</button>
  </div>
</div>

<script>
const API = "/api/admin";
let token = localStorage.getItem("admin_token") || "";
let currentView = "overview";
const charts = {};
const S = {
  follow: { days: 30, q: "" },
  parse: { source: "local", days: 30, q: "" },
  visit: { days: 30, q: "" },
  sources: { page: 1, size: 20, q: "", platform: "", status: "" }
};

function api(path, opts = {}) {
  opts.headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  if (token) opts.headers["Authorization"] = "Bearer " + token;
  return fetch(API + path, opts).then(async r => {
    if (r.status === 401) { logout(); throw new Error("登录已过期"); }
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.detail || data.message || ("请求失败 " + r.status));
    return data;
  });
}
function qs(obj) { return "?" + Object.entries(obj).filter(([,v]) => v !== "" && v != null).map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join("&"); }
function fmt(n) { return (n ?? 0).toLocaleString(); }
function fmtTime(value) {
  if (!value) return "—";
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return value;
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function esc(s) { return (s ?? "").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function showModal(title, body, isError) {
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-title").style.color = isError ? "var(--danger)" : "var(--text)";
  document.getElementById("modal-body").textContent = body;
  document.getElementById("modal").classList.remove("hidden");
}
function hideModal() {
  document.getElementById("modal").classList.add("hidden");
}

function init() {
  document.querySelectorAll("aside nav a[data-view]").forEach(a => a.onclick = () => show(a.dataset.view));
  document.getElementById("pass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
  if (token) { boot(); } else { document.getElementById("login").classList.remove("hidden"); }
}
async function doLogin() {
  const pass = document.getElementById("pass").value;
  try {
    const data = await api("/login", { method: "POST", body: JSON.stringify({ password: pass }) });
    token = data.token; localStorage.setItem("admin_token", token);
    boot();
  } catch (e) { document.getElementById("login-err").textContent = e.message; }
}
function logout() { token = ""; localStorage.removeItem("admin_token"); location.reload(); }
function boot() {
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  show("overview");
}
function show(view) {
  currentView = view;
  document.querySelectorAll("aside nav a[data-view]").forEach(a => a.classList.toggle("active", a.dataset.view === view));
  document.querySelectorAll(".view").forEach(v => v.classList.add("hidden"));
  const el = document.getElementById("view-" + view);
  el.classList.remove("hidden");
  renderers[view] && renderers[view](el);
}
function drawChart(id, render) {
  if (typeof echarts === "undefined") return;
  if (charts[id]) charts[id].dispose();
  const el = document.getElementById(id);
  const chart = echarts.init(el);
  render(chart);
  charts[id] = chart;
  window.addEventListener("resize", () => chart.resize());
}

const renderers = {
  async overview(el) {
    el.innerHTML = "加载中…";
    const d = await api("/stats/overview?days=30").catch(e => { el.innerHTML = `<div class="alert">${esc(e.message)}</div>`; return null; });
    if (!d) return;
    const cookie = d.cookie || {};
    const visit = d.visit || {};
    const bot = d.bot || {};
    const parse = d.parse || {};
    const dl = d.download || {};
    const domains = d.domains || {};

    // 需要动一下手的事放最上面，其余只看数字
    const alerts = [];
    alerts.push(cookie.cookie_valid === false
      ? `<div class="alert">⚠ 机器人 Cookie 已失效（${esc(cookie.cookie_last_error || "")}）—— 私信发码和评论 @ 监听都会停</div>`
      : `<div class="alert ok">◎ 机器人 Cookie 正常（最近检查 ${esc(cookie.cookie_last_checked || "—")}）</div>`);
    if (domains.unconfigured) {
      const hosts = (domains.recent_unconfigured || []).map(h => esc(h.host)).join("、");
      const newToday = domains.new_unconfigured_today || 0;
      const todayHosts = (domains.new_unconfigured_today_hosts || []).map(h => esc(h.host)).join("、");
      alerts.push(`<div class="alert">⚠ ${fmt(domains.unconfigured)} 个下载域名还没配置到微信后台，用户会下载失败`
        + `${newToday ? `，其中 <b>${fmt(newToday)} 个是今天新出现的</b>${todayHosts ? `（${todayHosts}）` : ""}` : ""}`
        + `${hosts ? `（最近出现：${hosts}）` : ""} · <a href="javascript:void(0)" onclick="show('cdn')">去处理</a></div>`);
    }

    const failReasons = (dl.fail_by_error || []).slice(0, 3)
      .map(x => `${esc(errorLabel(x.error_type))} ${fmt(x.count)}`).join(" · ");
    const parseOk = (parse.local_ok || 0) + (parse.robot_ok || 0);
    const parseFail = (parse.local_fail || 0) + (parse.robot_fail || 0);

    el.innerHTML = `
      ${alerts.join("")}

      <div class="panel">
        <h3>访问情况</h3>
        <p class="note">用户访问小程序（每人每天最多上报一次，等于"访问过的微信用户数"）</p>
        <div class="metric-row">
          <div class="metric"><b class="blue">${fmt(visit.today_uv)}</b><span>人今日访问</span></div>
          <div class="metric"><b>${fmt(visit.total_uv)}</b><span>人累计访问</span></div>
          <div class="metric"><b>${fmt(visit.progress)}%</b><span>500 访客目标（还差 ${fmt(Math.max((visit.target || 0) - (visit.total_uv || 0), 0))} 人）</span></div>
        </div>
      </div>

      <div class="panel">
        <h3>机器人关注与绑定 <span class="tag muted">@壁咚咚私藏</span></h3>
        <p class="note">粉丝关注机器人 → 机器人私信激活码 → 小程序粘贴绑定</p>
        <div class="metric-row">
          <div class="metric"><b class="blue">${fmt(bot.followers_today)}</b><span>今日新增关注</span></div>
          <div class="metric"><b>${fmt(bot.followers_total)}</b><span>关注总数</span></div>
          <div class="metric"><b class="ok">${fmt(bot.bound)}</b><span>已绑定</span></div>
          <div class="metric"><b>${fmt(bot.conversion)}%</b><span>关注→绑定转化</span></div>
        </div>
      </div>

      <div class="panel">
        <h3>视频解析</h3>
        <p class="note">去重用户数：贴链接按小程序用户算，评论 @ 按 B站 UID 算（机器人链路没有小程序用户）</p>
        <div class="metric-row">
          <div class="metric"><b class="blue">${fmt(parse.local_users_today)}</b><span>今日贴链接触发</span></div>
          <div class="metric"><b class="blue">${fmt(parse.robot_users_today)}</b><span>今日评论 @ 触发</span></div>
          <div class="metric"><b>${fmt((parse.local_users || 0) + (parse.robot_users || 0))}</b><span>近 30 天解析用户</span></div>
          <div class="metric"><b class="ok">${fmt(parseOk)}</b><span>成功（失败 ${fmt(parseFail)}）</span></div>
        </div>
      </div>

      <div class="panel">
        <h3>视频下载</h3>
        <p class="note">一次下载算一次；用户改用"复制链接到浏览器保存"也算成功</p>
        <div class="metric-row">
          <div class="metric"><b class="blue">${fmt(dl.today_total)}</b><span>今日下载（成功 ${fmt((dl.today_saved || 0) + (dl.today_copied || 0))} · 失败 ${fmt(dl.today_fail)}）</span></div>
          <div class="metric"><b>${fmt(dl.total)}</b><span>近 30 天下载</span></div>
          <div class="metric"><b class="ok">${fmt(dl.success)}</b><span>成功（保存 ${fmt(dl.saved)} + 复制链接 ${fmt(dl.copied)}）</span></div>
          <div class="metric"><b class="bad">${fmt(dl.fail)}</b><span>失败</span></div>
          <div class="metric"><b>${fmt(dl.success_rate)}%</b><span>成功率</span></div>
        </div>
        <p class="note" style="margin:10px 0 0">失败原因：${failReasons || "无"}</p>
      </div>

      <div class="panel">
        <h3>B站 CDN 域名</h3>
        <p class="note">下载直链用到的域名；没配置到微信后台的域名，用户点下载会失败</p>
        <div class="metric-row">
          <div class="metric"><b class="${domains.new_unconfigured_today ? 'bad' : 'ok'}">${fmt(domains.new_unconfigured_today)}</b><span>今日新增未配置</span></div>
          <div class="metric"><b>${fmt(domains.total)}</b><span>已登记域名</span></div>
          <div class="metric"><b class="ok">${fmt(domains.configured)}</b><span>已配置</span></div>
          <div class="metric"><b class="warn">${fmt(domains.unconfigured)}</b><span>未配置</span></div>
          <div class="metric"><b>${fmt(domains.hits)}</b><span>累计命中次数</span></div>
        </div>
      </div>

      <div class="panel">
        <h3>近 30 天访问用户趋势</h3>
        <p class="note">每天有多少个不同的用户打开了小程序（每人每天最多上报一次）</p>
        <div id="chart-overview" class="chart"></div>
      </div>`;
    drawChart("chart-overview", chart => chart.setOption({
      tooltip: { trigger: "axis" },
      grid: { left: 44, right: 24, top: 20, bottom: 30 },
      xAxis: { type: "category", data: (visit.trend || []).map(x => x.date.slice(5)) },
      yAxis: { type: "value", minInterval: 1 },
      series: [{
        name: "访问用户",
        type: "line",
        smooth: true,
        symbolSize: 6,
        areaStyle: { opacity: 0.12 },
        data: (visit.trend || []).map(x => x.uv)
      }]
    }));
  },

  async follow(el) {
    const { days, q } = S.follow;
    const s = await api("/stats/follow-monitor?days=" + days);
    const det = await api("/stats/follow-monitor/detail" + qs({ q, days, page: 1, size: 20 }));
    el.innerHTML = `
      <div class="cards">
        <div class="card"><div class="label">关注总数</div><div class="value">${fmt(s.total)}</div><div class="sub ok">今日 +${fmt(s.today)}</div></div>
        <div class="card"><div class="label">已发码</div><div class="value ok">${fmt(s.sent_ok)}</div></div>
        <div class="card"><div class="label">发码失败</div><div class="value bad">${fmt(s.sent_fail)}</div></div>
        <div class="card"><div class="label">已绑定</div><div class="value">${fmt(s.bound)}</div></div>
      </div>
      <div class="panel"><h3>新增关注趋势</h3><div id="chart-follow" class="chart"></div></div>
      <div class="panel">
        <h3>明细</h3>
        <div class="toolbar">
          <input placeholder="搜索昵称 / UID" value="${esc(q)}" onchange="S.follow.q=this.value; show('follow')"/>
          <select onchange="S.follow.days=parseInt(this.value); show('follow')">${[7,30,90].map(d=>`<option value="${d}" ${d===days?"selected":""}>近${d}天</option>`).join("")}</select>
        </div>
        <div class="toolbar">
          <button onclick="batchResend()">重新发送选中</button>
          <button class="ghost" onclick="retryFailed()">重发全部失败</button>
          <span id="follow-msg" class="muted"></span>
        </div>
        <table>
          <thead><tr><th></th><th>粉丝</th><th>微信</th><th>关注时间</th><th>激活码</th><th>发送</th><th>失败原因</th><th>绑定</th><th>绑定时间</th><th>操作</th></tr></thead>
          <tbody>${det.items.map(followRow).join("")}</tbody>
        </table>
        <p class="muted">共 ${fmt(det.total)} 条</p>
      </div>
      <div class="panel">
        <h3>单独发送</h3>
        <div class="toolbar">
          <input id="single-uid" placeholder="输入 B站 UID" style="min-width:180px"/>
          <button onclick="singleSend()">发送激活码</button>
        </div>
        <p class="muted">用于临时给指定 B站账号发码（已有码且未绑定的会重发同一个码）。</p>
      </div>`;
    drawChart("chart-follow", chart => chart.setOption({
      tooltip: { trigger: "axis" }, grid: { left: 40, right: 20, top: 20, bottom: 30 },
      xAxis: { type: "category", data: s.trend.map(x => x.date.slice(5)) },
      yAxis: { type: "value", minInterval: 1 },
      series: [{ type: "line", smooth: true, areaStyle: {}, data: s.trend.map(x => x.count) }]
    }));
  },

  async parse(el) {
    const { source, days, q } = S.parse;
    const rangeOpts = [7,30,90].map(d => `<option value="${d}" ${d===days?"selected":""}>近${d}天</option>`).join("");
    const tabs = `
      <div class="toolbar">
        <button class="pill ${source==='local'?'active':''}" onclick="S.parse.source='local'; S.parse.q=''; show('parse')">贴链接解析</button>
        <button class="pill ${source==='robot'?'active':''}" onclick="S.parse.source='robot'; S.parse.q=''; show('parse')">@评论触发</button>
        <input placeholder="搜索" value="${esc(q)}" onchange="S.parse.q=this.value; show('parse')" style="min-width:180px"/>
        <select onchange="S.parse.days=parseInt(this.value); show('parse')">${rangeOpts}</select>
      </div>`;

          <select onchange="S.visit.days=parseInt(this.value); show('visit')">${[7,30,90].map(d=>`<option value="${d}" ${d===days?"selected":""}>近${d}天</option>`).join("")}</select>

        { name: "UV", type: "line", smooth: true, data: s.trend.map(x => x.uv) },

        <p class="muted">「可能闲置」表示 30 天未出现，「建议删除」表示 60 天未出现。系统只提醒，不会自动删除微信后台配置。</p>

function resultTag(r) {
  if (r === "collected") return '<span class="tag ok">已收藏</span>';
  if (r === "parse_failed") return '<span class="tag bad">解析失败</span>';
  if (r === "unbound") return '<span class="tag muted">未绑定</span>';
  if (r === "error") return '<span class="tag bad">异常</span>';
  return esc(r);
}

function atRow(i) {
  const origin = esc(i.bili_name || "") +
    (i.bili_name && i.bili_uid ? "（" + esc(i.bili_uid) + "）" : (i.bili_uid ? esc(i.bili_uid) : ""));
  const video = esc(i.video_title || "—") + "<br/><span class='muted'>" + esc(i.bvid || "") + "</span>";
  return `<tr><td>${esc(i.created_at)}</td><td>${esc(i.comment)}</td><td>${origin}</td><td>${video}</td><td>${resultTag(i.result)}</td><td>${esc(i.reason || "—")}</td></tr>`;
}

function localRow(i) {
  const result = i.ok ? '<span class="tag ok">成功</span>' : '<span class="tag bad">失败</span>';
  const reason = i.ok ? "—" : (i.reason || "—");
  return `<tr><td>${esc(i.created_at)}</td><td>${esc(i.origin || "—")}</td><td>${esc(i.input) || "—"}</td><td>${esc(i.video_title || "—")}</td><td>${esc(i.bvid || "—")}</td><td>${result}</td><td>${esc(reason)}</td></tr>`;
}

function downloadRow(i) {
  const status = i.status === "success"
    ? '<span class="tag ok">成功</span>'
    : '<span class="tag bad">失败</span>';
  const kindMap = { watermarked: "水印视频", clean: "无水印", audio: "音频" };
  const error = [i.error_type, i.error_message, i.wx_err_msg].filter(Boolean).join(" / ");
  let title = esc(i.video_title || "—");
  if (i.video_title && i.source_url) {
    title = `<a href="${esc(i.source_url)}" target="_blank" rel="noopener">${title}</a>`;
  }
  const video = title + (i.bvid ? `<br/><span class="muted">${esc(i.bvid)}</span>` : "");
  const user = `<span class="host">${esc(i.openid || "—")}</span>`;
  return `<tr><td>${esc(fmtTime(i.created_at))}</td><td>${user}</td><td>${video}</td><td>${esc(kindMap[i.kind] || i.kind || "—")}</td><td>${esc(i.host || "—")}</td><td>${esc(i.stage || "—")}</td><td>${status}</td><td>${esc(error || "—")}</td></tr>`;
}

function visitRow(i) {
  return `<tr><td>${esc(i.created_at)}</td><td><span class="host">${esc(i.openid || "—")}</span></td><td>${esc(i.nickname || "—")}</td><td>${esc(i.path || "—")}</td></tr>`;
}

function sourceRow(i) {
  const platform = i.platform_label || i.platform;

function domainRow(i) {
  const configTag = i.is_configured
    ? '<span class="tag ok">已配置</span>'
    : '<span class="tag bad">未配置</span>';
  const suggestion = i.suggestion || "";
  const cls = suggestion === "建议删除" ? "bad" : suggestion === "可能闲置" ? "muted" : suggestion === "需要配置" ? "bad" : "ok";
  const host = `<span class="host">${esc(i.host)}</span>`;
  const toggle = i.is_configured
    ? `<button class="small ghost" onclick="saveDomain('${esc(i.host)}', false)">标记未配置</button>`
    : `<button class="small" onclick="saveDomain('${esc(i.host)}', true)">标记已配置</button>`;
  return `<tr><td>${host}</td><td>${configTag}</td><td>${i.is_configured ? "是" : "否"}</td><td>${fmt(i.seen_count)}</td><td>${fmt(i.download_success_count)} / ${fmt(i.download_failure_count)}</td><td>${esc(fmtTime(i.last_seen_at))}</td><td><span class="tag ${cls}">${esc(suggestion)}</span></td><td>${toggle}</td></tr>`;
}

async function saveDomain(host, configured) {
  try {
    await api("/download/domains/" + encodeURIComponent(host), {
      method: "PUT",
      body: JSON.stringify({ is_configured: configured })
    });
    show("cdn");
  } catch (e) {
    showModal("保存失败", e.message, true);
  }
}

async function importDomains() {
  const input = document.getElementById("domain-bulk");
  const text = input ? input.value.trim() : "";
  if (!text) {
    showModal("提示", "请先粘贴域名，例如 https://a.com;https://b.com", true);
    return;
  }
  try {
    const r = await api("/download/domains/bulk", {
      method: "POST",
      body: JSON.stringify({ text })
    });
    const parts = [
      "1. 新增配置：" + (r.inserted.length ? r.inserted.join("、") : "无"),
      "2. 更新配置：" + (r.updated.length ? r.updated.join("、") : "无"),
      "3. 已配置无需新增更新：" + (r.already_configured.length ? r.already_configured.join("、") : "无"),
      "4. 忽略无效：" + (r.invalid.length ? r.invalid.join("、") : "无")
    ];
    showModal("处理完成", parts.join("\n"), false);
    show("cdn");
  } catch (e) {
    showModal("保存失败", e.message, true);
  }
}

async function resendUid(uid) {
  try {
    const r = await api("/activation/resend", { method: "POST", body: JSON.stringify({ uids: [uid] }) });
    const failInfo = Object.keys(r.failed || {}).length ? `，失败 ${Object.keys(r.failed).length}` : "";
    showModal("发送结果", `成功 ${r.sent}${failInfo}，共 ${r.total} 条`, false);
    show(currentView);
  } catch (e) { showModal("发送失败", e.message, true); }
}
async function unbindUid(uid) {
  if (!confirm("确定解绑该用户？")) return;
  try {
    const r = await api("/binding/unbind", { method: "POST", body: JSON.stringify({ bili_uid: uid }) });
    showModal("解绑成功", `B站 UID ${r.bili_uid} 已解绑，激活码：${r.code}`, false);
    show(currentView);
  } catch (e) { showModal("解绑失败", e.message, true); }
}

    showModal("批量发送结果", `成功 ${r.sent}${failInfo}，共 ${r.total} 条`, false);

}

async function saveFeatures() {
  const mediaBody = {
    watermarked: document.getElementById("feat-watermarked").checked,
    clean: document.getElementById("feat-clean").checked,
    audio: document.getElementById("feat-audio").checked
  };
  const parseBody = {
    comment: document.getElementById("feat-comment").checked,
    danmaku: document.getElementById("feat-danmaku").checked
  };
  const uiBody = {
    robot_guide: document.getElementById("feat-robot_guide").checked,
    share: document.getElementById("feat-share").checked
  };
  try {
    await api("/config/features", { method: "PUT", body: JSON.stringify(mediaBody) });
    await api("/config/parse-features", { method: "PUT", body: JSON.stringify(parseBody) });
    await api("/config/ui", { method: "PUT", body: JSON.stringify(uiBody) });
    const [f, p, u] = await Promise.all([
      api("/config/features"),
      api("/config/parse-features"),
      api("/config/ui"),
    ]);
    document.getElementById("feat-watermarked").checked = !!f.watermarked;
    document.getElementById("feat-clean").checked = !!f.clean;
    document.getElementById("feat-audio").checked = !!f.audio;
    document.getElementById("feat-comment").checked = !!p.comment;
    document.getElementById("feat-danmaku").checked = !!p.danmaku;
    document.getElementById("feat-robot_guide").checked = !!u.robot_guide;
    document.getElementById("feat-share").checked = !!u.share;
    showModal("保存成功", "功能开关已保存并生效。", false);
  } catch (e) { showModal("保存失败", e.message, true); }
}
async function saveSchedule() {

async function importSources() {
  const csv = document.getElementById("source-csv").value;
  if (!csv.trim()) { showModal("提示", "请先粘贴 CSV 内容", true); return; }
  try {
    const r = await api("/sources/import", { method: "POST", body: JSON.stringify({ csv }) });
    const rejected = r.rejected || [];
    const lines = [
      `新增：${r.created} 条`,
      `更新：${r.updated} 条`,
      `拒收：${rejected.length} 条`,
    ];
    if (rejected.length) {
      lines.push("", "拒收明细（最多 5 条）：");
      rejected.slice(0, 5).forEach(x => lines.push(`· ${x.bvid || "(空 bvid)"}：${x.reason}`));
    }
    showModal("导入完成", lines.join("\n"), false);
    show("sources");
  } catch (e) { showModal("导入失败", e.message, true); }
}
async function uploadRepostAvatar() {
  const input = document.getElementById("repost-avatar-file");
  const msg = document.getElementById("repost-avatar-msg");
  if (!input || !input.files || !input.files.length) { msg.textContent = "请先选择图片"; return; }
  const file = input.files[0];
  if (file.size > 2 * 1024 * 1024) { msg.textContent = "图片需小于 2MB"; return; }
  try {
    // 直接发原始字节，避免为一次上传引入 multipart 依赖
    const res = await fetch(API + "/sources/avatar", {
      method: "POST",
      headers: { "Content-Type": file.type || "image/jpeg", Authorization: "Bearer " + token },
      body: file,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || data.message || ("上传失败 " + res.status));
    document.getElementById("repost-avatar").value = data.account_avatar_url || "";
    const preview = document.getElementById("repost-avatar-preview");
    if (preview) { preview.src = data.account_avatar_url; preview.style.visibility = "visible"; }
    msg.textContent = "已上传";
  } catch (e) { msg.textContent = e.message; }
}

}
